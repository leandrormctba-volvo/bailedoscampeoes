<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a6474"/><stop offset=".55" stop-color="#0b3a46"/><stop offset="1" stop-color="#04181f"/></linearGradient>
    <radialGradient id="gl" cx=".72" cy=".25" r=".5"><stop offset="0" stop-color="#f2b632" stop-opacity=".35"/><stop offset="1" stop-color="#f2b632" stop-opacity="0"/></radialGradient>
    <linearGradient id="tb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f7a8c"/><stop offset="1" stop-color="#0d4552"/></linearGradient>
    <radialGradient id="ball" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#ffe2a6"/><stop offset="1" stop-color="#e0a440"/></radialGradient>
    <linearGradient id="rub" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0473c"/><stop offset="1" stop-color="#8e1c16"/></linearGradient>
    <linearGradient id="rub2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b2f36"/><stop offset="1" stop-color="#0b0d12"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8c38a"/><stop offset="1" stop-color="#9c6b33"/></linearGradient>
  </defs>
  <rect width="1280" height="1000" fill="url(#bg)"/>
  <rect width="1280" height="1000" fill="url(#gl)"/>
  <!-- mesa em perspectiva -->
  <polygon points="250,560 1030,560 1220,860 60,860" fill="url(#tb)" stroke="#e9f6f7" stroke-width="8"/>
  <line x1="640" y1="560" x2="640" y2="860" stroke="#e9f6f7" stroke-width="5"/>
  <polygon points="60,860 1220,860 1220,890 60,890" fill="#082a33"/>
  <rect x="150" y="890" width="26" height="110" fill="#06202a"/><rect x="1104" y="890" width="26" height="110" fill="#06202a"/>
  <!-- rede -->
  <polygon points="200,560 1080,560 1080,470 200,470" fill="rgba(233,246,247,.12)" stroke="#e9f6f7" stroke-width="5"/>
  <g stroke="rgba(233,246,247,.35)" stroke-width="2">
    <path d="M240 470V560M300 470V560M360 470V560M420 470V560M480 470V560M540 470V560M600 470V560M660 470V560M720 470V560M780 470V560M840 470V560M900 470V560M960 470V560M1020 470V560"/>
    <path d="M200 500H1080M200 530H1080"/>
  </g>
  <rect x="196" y="462" width="888" height="12" fill="#f2f7f7"/>
  <!-- raquete esquerda -->
  <g transform="rotate(-28 300 300)">
    <rect x="278" y="380" width="44" height="170" rx="16" fill="url(#wood)"/>
    <ellipse cx="300" cy="270" rx="140" ry="150" fill="url(#rub)" stroke="#5a120e" stroke-width="6"/>
  </g>
  <!-- raquete direita -->
  <g transform="rotate(32 990 330)">
    <rect x="968" y="410" width="44" height="170" rx="16" fill="url(#wood)"/>
    <ellipse cx="990" cy="300" rx="140" ry="150" fill="url(#rub2)" stroke="#000" stroke-width="6"/>
  </g>
  <!-- trajetória e bola -->
  <path d="M420 300 Q 640 80 820 330" fill="none" stroke="#f2b632" stroke-width="6" stroke-dasharray="4 22" stroke-linecap="round" opacity=".8"/>
  <circle cx="830" cy="350" r="38" fill="url(#ball)"/>
  <circle cx="830" cy="350" r="70" fill="#f2b632" opacity=".15"/>
</svg>
