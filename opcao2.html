<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melhores do Ano AV 2026 — Opção 2 (prévia)</title>
<meta name="description" content="Festa dos Campeões — Melhores do Ano AV 2026 · Associação Volvo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261128b">
<link rel="stylesheet" href="css/opcao2.css?v=20261128b">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<div id="viewport">
  <div id="stage">
    <div id="slides"></div>
    <div class="o2-corner" aria-hidden="true"><b>MELHORES DO ANO</b><span>AV 2026</span></div>
    <div class="o2-stripes" aria-hidden="true"></div>
    <canvas id="confetti" width="1920" height="1080" aria-hidden="true"></canvas>
  </div>
</div>

<!-- Logo Associação Volvo: fica no pé da tela (centralizado), em todos os slides -->
<footer class="brand">
  <img id="logoImg" src="img/logo-associacao-volvo.png" alt="Associação Volvo" hidden
       onload="this.hidden=false;document.getElementById('logoText').hidden=true">
  <span id="logoText">ASSOCIAÇÃO VOLVO</span>
</footer>

<nav id="hud" aria-label="Controles da apresentação">
  <div class="bar"><i id="progress"></i></div>
  <div class="ctrls">
    <button id="bPrev" title="Anterior (←)">‹</button>
    <span id="counter">1 / 1</span>
    <button id="bNext" title="Próximo (→)">›</button>
    <button id="bPlay" title="Passar sozinho (P)">▶ Auto</button>
    <button id="bFull" title="Tela cheia (F)">⛶</button>
  </div>
</nav>

<script>window.START_AT_BEGINNING = true; // ao atualizar a página, volta ao slide 1</script>

<script src="js/opcao2-extra.js?v=20261128b"></script>
