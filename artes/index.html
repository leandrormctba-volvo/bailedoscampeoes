<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artes — Melhores do Ano AV 2026</title>
<!-- Apresentação das artes: setas (ou toque/arraste) para passar, miniaturas embaixo, botão para baixar -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #04181f; --gold: #f2b632; --line: rgba(255,255,255,.14); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); color: #fff; font-family: 'Montserrat', Arial, sans-serif; overflow: hidden; }
  body { display: grid; grid-template-rows: auto 1fr auto; height: 100dvh;
    background: radial-gradient(60% 60% at 50% 40%, #0e4351, var(--bg)); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 24px; }
  header h1 { font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 26px; letter-spacing: .04em; text-transform: uppercase; }
  header h1 span { color: var(--gold); }
  .count { font-weight: 800; font-size: 15px; color: rgba(255,255,255,.7); }
  body > * { min-width: 0; }
  main { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 8px 72px; min-height: 0; }
  figure { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; max-height: 100%; min-height: 0; }
  figure img { display: block; max-width: 100%; max-height: calc(100dvh - 260px); object-fit: contain; border-radius: 6px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6); border: 1px solid var(--line); background: #062a33; }
  figcaption { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 18px; text-align: center; }
  figcaption b { font-size: 18px; } figcaption small { color: rgba(255,255,255,.65); font-size: 14px; font-weight: 600; }
  .dl { color: #0b0d12; background: var(--gold); text-decoration: none; font-weight: 800; font-size: 14px; padding: 8px 16px; border-radius: 6px; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line);
    background: rgba(255,255,255,.08); color: #fff; font-size: 26px; cursor: pointer; }
  .nav:hover { background: rgba(242,182,50,.25); } .prev { left: 12px; } .next { right: 12px; }
  .thumbs { display: flex; gap: 10px; justify-content: center; padding: 12px 16px 18px; overflow-x: auto; }
  .thumbs button { flex: 0 0 auto; width: 120px; border: 2px solid transparent; border-radius: 6px; padding: 0; background: none; cursor: pointer; opacity: .55; }
  .thumbs button.on { border-color: var(--gold); opacity: 1; }
  .thumbs img { display: block; width: 100%; border-radius: 4px; }
  /* número de referência de cada arte (aparece só na página, não sai na imagem para impressão) */
  .pic { position: relative; max-width: 100%; min-height: 0; display: flex; }
  .num { position: absolute; left: 16px; bottom: 16px; min-width: 80px; height: 80px; padding: 0 18px;
    border-radius: 40px; display: grid; place-items: center; font-family: 'Anton', Impact, sans-serif; font-size: 48px; line-height: 1;
    color: #0b0d12; background: var(--gold); box-shadow: 0 10px 40px rgba(0,0,0,.5); border: 4px solid #fff; pointer-events: none; }
  .thumbs button { position: relative; }
  .thumbs button span { position: absolute; left: 6px; top: 6px; min-width: 26px; height: 26px; border-radius: 13px; display: grid; place-items: center;
    font-family: 'Anton', Impact, sans-serif; font-size: 16px; color: #0b0d12; background: var(--gold); }
  @media (max-width: 640px) { .num { left: 8px; bottom: 8px; min-width: 44px; height: 44px; font-size: 26px; padding: 0 10px; border-width: 3px; } }
  @media (max-width: 640px) {
    header { padding: 10px 16px; } header h1 { font-size: 20px; }
    main { padding: 8px 16px; } .nav { width: 40px; height: 40px; font-size: 20px; top: auto; bottom: -6px; transform: none; }
    .thumbs button { width: 84px; }
  }
</style></head>
<body>
<header><h1>Melhores do Ano <span>AV 2026</span> · Artes</h1><div class="count" id="count"></div></header>
<main>
  <button class="nav prev" id="prev" aria-label="Anterior">‹</button>
  <figure><div class="pic"><img id="img" alt=""><span class="num" id="num"></span></div><figcaption><b id="name"></b><small id="info"></small><a class="dl" id="dl" download>Baixar imagem</a></figcaption></figure>
  <button class="nav next" id="next" aria-label="Próxima">›</button>
</main>
<nav class="thumbs" id="thumbs"></nav>
<script>
  // lista das artes (arquivo, nome e descrição)
  const ARTES = [
    ['banner-5x3.png', 'Banner 5 x 3 — logo no meio', 'Estrela no canto inferior direito · fundo com linhas de quadra'],
    ['banner-5x3-logo-direita.png', 'Banner 5 x 3 — logo à direita', 'Estrela no canto inferior direito · fundo com linhas de quadra'],
    ['banner-5x3-pista.png', 'Banner 5 x 3 — pista de atletismo', 'Pista em 3D com raias de luz · estrela no canto inferior direito'],
    ['banner-5x3-trofeu.png', 'Banner 5 x 3 — troféu (foto real)', 'Mãos erguendo o troféu · logo no canto superior direito'],
    ['arte-estrela.png', 'Arte 16:9 — estrela', 'Formato de tela (1920 x 1080)'],
    ['arte-trofeu.png', 'Arte 16:9 — troféu e medalhas', 'Formato de tela (1920 x 1080)'],
    ['banner-5x3-rodape.png', 'Banner 5 x 3 — rodapé esportivo', 'Título, logo e estrela com brilho na mesma linha · rodapé com contornos de bolas em luz'],
    ['banner-5x3-emblema.png', 'Banner 5 x 3 — emblema dourado', 'Estrela e Melhores do Ano centralizados, estilo prêmio'],
    ['banner-5x3-painel.png', 'Banner 5 x 3 — painel intercalado (AV 2026 amarelo)', 'Colunas alternadas: Melhores do Ano e Associação / Volvo em branco'],
    ['banner-5x3-painel-raios.png', 'Banner 5 x 3 — painel com destaque de luz', 'Brilho suave atrás de cada selo · AV 2026 amarelo'],
    ['banner-5x3-painel-linha.png', 'Banner 5 x 3 — painel com linha', 'Linha dourada embaixo de cada selo · fundo em degradê do meio para fora'],
    ['banner-5x3-emblema-topo.png', 'Banner 5 x 3 — emblema no alto', 'Emblema dourado menor, no meio e em cima (até ~1,20 m do topo)'],
    ['banner-5x3-painel-estrela.png', 'Banner 5 x 3 — Melhores do Ano na estrela', 'Melhores do Ano AV 2026 dentro da estrela 3D · Associação Volvo sem efeito']
  ];
  const $ = id => document.getElementById(id);
  let cur = 0;
  $('thumbs').innerHTML = ARTES.map((a, i) => `<button data-i="${i}" aria-label="Arte ${i + 1}: ${a[1]}"><img src="miniaturas/${a[0].replace('.png', '.jpg')}" alt=""><span>${i + 1}</span></button>`).join('');
  function show(i) {
    cur = (i + ARTES.length) % ARTES.length;
    const [f, n, d] = ARTES[cur];
    $('img').src = f; $('img').alt = n; $('name').textContent = 'Arte ' + (cur + 1) + ' · ' + n; $('num').textContent = cur + 1; $('info').textContent = d;
    $('dl').href = f; $('count').textContent = (cur + 1) + ' / ' + ARTES.length;
    document.querySelectorAll('.thumbs button').forEach((b, k) => b.classList.toggle('on', k === cur));
    document.querySelector('.thumbs .on').scrollIntoView({ block: 'nearest', inline: 'center' });
    history.replaceState(null, '', '#' + (cur + 1));
  }
  $('prev').onclick = () => show(cur - 1);
  $('next').onclick = () => show(cur + 1);
  $('thumbs').onclick = e => { const b = e.target.closest('button'); if (b) show(+b.dataset.i); };
  addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === ' ') show(cur + 1); if (e.key === 'ArrowLeft') show(cur - 1); });
  let x0 = null;
  addEventListener('touchstart', e => x0 = e.touches[0].clientX, { passive: true });
  addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1)); x0 = null; });
  show((parseInt(location.hash.slice(1), 10) || 1) - 1);
</script>
</body></html>
