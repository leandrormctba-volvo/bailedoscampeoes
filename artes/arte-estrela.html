<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Arte 1 — Melhores do Ano AV 2026 (estrela)</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,900;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="arte-base.css">
<style>
  .glow { position: absolute; right: -60px; bottom: -120px; width: 1000px; height: 1000px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,226,140,.6), rgba(242,182,50,.18) 40%, transparent 68%); }
  .rays { position: absolute; right: -540px; bottom: -630px; width: 2000px; height: 2000px; opacity: .4;
    background: repeating-conic-gradient(from 0deg, rgba(242,182,50,.9) 0deg 3deg, transparent 3deg 15deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 45%); mask-image: radial-gradient(circle, #000 0%, transparent 45%); }
  .flare { position: absolute; border-radius: 50%; mix-blend-mode: screen; }
  .flare.h { right: -90px; bottom: 364px; width: 1100px; height: 12px; background: radial-gradient(ellipse, rgba(255,250,225,.95), rgba(255,214,120,.35) 35%, transparent 70%); }
  .flare.v { right: 454px; bottom: -90px; width: 12px; height: 920px; background: radial-gradient(ellipse, rgba(255,250,225,.9), rgba(255,214,120,.3) 35%, transparent 70%); }
  #star { position: absolute; right: 180px; bottom: 90px; width: 560px; height: 560px; transform: rotate(-8deg);
    filter: drop-shadow(0 0 34px rgba(255,214,110,.8)) drop-shadow(0 30px 50px rgba(0,0,0,.5)); }
  #star svg { width: 100%; height: 100%; display: block; }
  .core { position: absolute; right: 400px; bottom: 310px; width: 120px; height: 120px; border-radius: 50%; mix-blend-mode: screen;
    background: radial-gradient(circle, rgba(255,255,255,.95), rgba(255,240,190,.45) 40%, transparent 70%); }
  .spark { position: absolute; background: #fff7d6; clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); filter: drop-shadow(0 0 8px #ffe08a); }
</style></head>
<body><div class="art">
  <div class="court"></div><div class="streak" style="left:420px"></div><div class="streak" style="left:1180px"></div>
  <div class="glow"></div><div class="rays"></div>
  <div class="flare h"></div><div class="flare v"></div>
  <div id="star"></div>
  <div class="core"></div>
  <i class="spark" style="right:860px;bottom:520px;width:34px;height:34px"></i>
  <i class="spark" style="right:120px;bottom:660px;width:26px;height:26px"></i>
  <i class="spark" style="right:780px;bottom:150px;width:20px;height:20px"></i>
  <i class="spark" style="right:300px;bottom:760px;width:18px;height:18px"></i>
  <div class="vignette"></div>
  <img class="logo" src="../img/logo-associacao-volvo.png" alt="Associação Volvo">
  <div class="title">Melhores<br>do ano<span class="av">AV 2026</span><span class="bar"></span></div>
</div>
<script>
  // estrela dourada facetada (mesma da capa da apresentação)
  (function () {
    const C = 300, R = 280, r = 112, L = [-0.55, -0.83];
    const P = (a, rad) => [C + rad * Math.cos(a * Math.PI / 180), C + rad * Math.sin(a * Math.PI / 180)];
    const lo = [96, 56, 6], hi = [255, 246, 205];
    const col = t => 'rgb(' + lo.map((v, i) => Math.round(v + (hi[i] - v) * t)).join(',') + ')';
    let facets = '', outline = [];
    for (let k = 0; k < 5; k++) {
      const a = -90 + 72 * k, O = P(a, R), Ia = P(a - 36, r), Ib = P(a + 36, r);
      outline.push(Ia, O);
      for (const I of [Ia, Ib]) {
        let nx = -(O[1] - I[1]), ny = O[0] - I[0];
        const mx = (O[0] + I[0]) / 2 - C, my = (O[1] + I[1]) / 2 - C;
        if (nx * mx + ny * my < 0) { nx = -nx; ny = -ny; }
        const n = Math.hypot(nx, ny), t = Math.max(0, Math.min(1, .5 + .55 * ((nx / n) * L[0] + (ny / n) * L[1])));
        facets += '<path d="M' + C + ' ' + C + 'L' + I.map(v => v.toFixed(1)) + 'L' + O.map(v => v.toFixed(1)) + 'Z" fill="' + col(t) + '"/>';
      }
    }
    const pts = outline.map(p => p.map(v => v.toFixed(1)).join(' ')).join(' L');
    document.getElementById('star').innerHTML =
      '<svg viewBox="0 0 600 600"><defs><radialGradient id="sg" cx=".42" cy=".38" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>' +
      facets + '<path d="M' + pts + 'Z" fill="url(#sg)"/><path d="M' + pts + 'Z" fill="none" stroke="#ffe9a8" stroke-width="3" stroke-linejoin="round" opacity=".85"/></svg>';
  })();
</script>
</body></html>
