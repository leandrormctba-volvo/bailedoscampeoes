<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Banner 5 x 3 (rodapé esportivo) — Melhores do Ano AV 2026</title>
<!-- Banner para impressão: proporção 5 x 3 (ex.: 5 m de largura por 3 m de altura).
     Versão: título, logo Associação Volvo e estrela na mesma linha em cima;
     fundo petróleo limpo; rodapé com pedaços de bolas e elementos de esporte. -->
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2000px; height: 1200px; overflow: hidden; background: #062a33; color: #fff; }
  .art { position: relative; width: 2000px; height: 1200px; overflow: hidden;
    background:
      radial-gradient(55% 60% at 50% 40%, rgba(40,150,165,.35), transparent 70%),
      radial-gradient(40% 50% at 88% 10%, rgba(242,182,50,.14), transparent 65%),
      linear-gradient(160deg, #1a6474 0%, #0e4351 40%, #08303b 70%, #041c24 100%); }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(2,14,18,.45)); }

  /* faixa de cima: título (esquerda), logo (meio) e estrela (direita), alinhados na mesma linha */
  .top { position: absolute; left: 80px; right: 80px; top: 56px; height: 300px; display: flex; align-items: center; justify-content: space-between; z-index: 3; }
  .title { font-family: 'Anton', Impact, sans-serif; text-transform: uppercase; font-size: 92px; line-height: .98; letter-spacing: .01em;
    text-shadow: 0 10px 40px rgba(0,0,0,.35); width: 520px; }
  .title .av { display: block; color: #f2b632; }
  .title .bar { display: block; width: 150px; height: 9px; margin-top: 20px; background: linear-gradient(90deg, #f2b632 0 70%, transparent 70% 78%, #3fb5bf 78%); transform: skewX(-30deg); }
  .logo { width: 490px; filter: drop-shadow(0 4px 18px rgba(0,0,0,.4)); }
  .starbox { position: relative; width: 520px; height: 300px; display: flex; justify-content: flex-end; align-items: center; }
  /* estrela com luz vindo de trás: halo, raios suaves girando em volta e cruz de brilho */
  .sw { position: relative; width: 270px; height: 270px; margin-right: 10px; }
  .sw > div:not(#star) { position: absolute; left: 50%; top: 50%; border-radius: 50%; pointer-events: none; }
  .sw .rays { width: 900px; height: 900px; margin: -450px 0 0 -450px; opacity: .26;
    background: repeating-conic-gradient(from 4deg, rgba(255,214,120,.85) 0deg 2.5deg, transparent 2.5deg 11deg);
    -webkit-mask-image: radial-gradient(circle, #000 12%, transparent 50%); mask-image: radial-gradient(circle, #000 12%, transparent 50%); }
  .sw .halo { width: 640px; height: 640px; margin: -320px 0 0 -320px;
    background: radial-gradient(circle, rgba(255,240,200,.75) 0%, rgba(255,214,120,.45) 16%, rgba(242,182,50,.16) 38%, transparent 66%); }
  .sw .flare.h { width: 760px; height: 8px; margin: -4px 0 0 -380px; mix-blend-mode: screen;
    background: radial-gradient(ellipse, rgba(255,250,225,.95), rgba(255,214,120,.35) 35%, transparent 70%); }
  .sw .flare.v { width: 8px; height: 420px; margin: -210px 0 0 -4px; mix-blend-mode: screen;
    background: radial-gradient(ellipse, rgba(255,250,225,.9), rgba(255,214,120,.3) 35%, transparent 70%); }
  #star { position: relative; width: 270px; height: 270px; transform: rotate(-8deg);
    filter: drop-shadow(0 0 26px rgba(255,214,110,.8)) drop-shadow(0 20px 34px rgba(0,0,0,.5)); }
  #star svg { width: 100%; height: 100%; display: block; }

  /* rodapé: pedaços de bolas e elementos de esporte saindo da borda de baixo */
  .footer { position: absolute; left: 0; right: 0; bottom: 0; height: 460px; z-index: 2; }
  .footer svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 300px; z-index: 1;
    background: linear-gradient(to top, rgba(2,14,18,.7), transparent); }
</style></head>
<body><div class="art">
  <div class="floor"></div>
  <div class="footer" id="footer"></div>
  <div class="vignette"></div>
  <div class="top">
    <div class="title">Melhores<br>do ano<span class="av">AV 2026</span><span class="bar"></span></div>
    <img class="logo" src="../img/logo-associacao-volvo.png" alt="Associação Volvo">
    <div class="starbox"><div class="sw"><div class="rays"></div><div class="halo"></div><div class="flare h"></div><div class="flare v"></div><div id="star"></div></div></div>
  </div>
</div>
<script>
  // ?z=2 aumenta a arte (para gerar a imagem em alta resolução)
  const z = parseFloat(new URLSearchParams(location.search).get('z'));
  if (z) { document.documentElement.style.zoom = z; document.documentElement.style.overflow = 'hidden'; }

  // estrela dourada facetada (mesma da capa da apresentação)
  (function () {
    const C = 300, R = 280, r = 112, L = [-0.55, -0.83];
    const P = (a, rad) => [C + rad * Math.cos(a * Math.PI / 180), C + rad * Math.sin(a * Math.PI / 180)];
    const lo = [96, 56, 6], hi = [255, 246, 205];
    const col = t => 'rgb(' + lo.map((v, i) => Math.round(v + (hi[i] - v) * t)).join(',') + ')';
    let facets = '', outline = [];
    for (let k = 0; k < 5; k++) {
      const a = -90 + 72 * k, O = P(a, R), Ia = P(a - 36, r), Ib = P(a + 36, r);
      outline.push(Ia, O);
      for (const I of [Ia, Ib]) {
        let nx = -(O[1] - I[1]), ny = O[0] - I[0];
        const mx = (O[0] + I[0]) / 2 - C, my = (O[1] + I[1]) / 2 - C;
        if (nx * mx + ny * my < 0) { nx = -nx; ny = -ny; }
        const n = Math.hypot(nx, ny), t = Math.max(0, Math.min(1, .5 + .55 * ((nx / n) * L[0] + (ny / n) * L[1])));
        facets += '<path d="M' + C + ' ' + C + 'L' + I.map(v => v.toFixed(1)) + 'L' + O.map(v => v.toFixed(1)) + 'Z" fill="' + col(t) + '"/>';
      }
    }
    const pts = outline.map(p => p.map(v => v.toFixed(1)).join(' ')).join(' L');
    document.getElementById('star').innerHTML =
      '<svg viewBox="0 0 600 600"><defs><radialGradient id="sg" cx=".42" cy=".38" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>' +
      facets + '<path d="M' + pts + 'Z" fill="url(#sg)"/><path d="M' + pts + 'Z" fill="none" stroke="#ffe9a8" stroke-width="3" stroke-linejoin="round" opacity=".85"/></svg>';
  })();

  // rodapé esportivo só em contorno de luz (mesmo azul neon das raias da pista de atletismo)
  // coordenadas do rodapé: 2000 x 460; y = 460 é a borda de baixo do banner
  (function () {
    const defs = `<defs>
      <filter id="neon" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>`;
    // cada elemento tem um "miolo" escuro para os contornos de trás não aparecerem através dele
    const back = r => `<circle r="${r}" fill="#05242d" stroke="none"/>`;
    const basq = (x, y, r, rot) => `<g transform="translate(${x} ${y}) rotate(${rot})">${back(r)}<circle r="${r}"/>
      <path d="M0 ${-r}V${r}M${-r} 0H${r}"/>
      <path d="M${-r * .7} ${-r * .72}C${-r * .25} ${-r * .3} ${-r * .25} ${r * .3} ${-r * .7} ${r * .72}"/>
      <path d="M${r * .7} ${-r * .72}C${r * .25} ${-r * .3} ${r * .25} ${r * .3} ${r * .7} ${r * .72}"/></g>`;
    const pent = (cx, cy, s, rot) => { let p = ''; for (let k = 0; k < 5; k++) { const a = (rot - 90 + 72 * k) * Math.PI / 180; p += (k ? 'L' : 'M') + (cx + s * Math.cos(a)).toFixed(1) + ' ' + (cy + s * Math.sin(a)).toFixed(1); } return p + 'Z'; };
    const fut = (x, y, r, rot) => { let g = `<path d="${pent(0, 0, r * .32, 0)}"/>`;
      for (let k = 0; k < 5; k++) { const a = (-90 + 72 * k) * Math.PI / 180;
        g += `<path d="M${(Math.cos(a) * r * .32).toFixed(1)} ${(Math.sin(a) * r * .32).toFixed(1)}L${(Math.cos(a) * r * .68).toFixed(1)} ${(Math.sin(a) * r * .68).toFixed(1)}"/>`;
        g += `<path d="${pent(Math.cos(a) * r * .95, Math.sin(a) * r * .95, r * .3, 36 + 72 * k)}"/>`; }
      return `<g transform="translate(${x} ${y}) rotate(${rot})"><clipPath id="cf${x}"><circle r="${r}"/></clipPath>${back(r)}<g clip-path="url(#cf${x})">${g}</g><circle r="${r}"/></g>`; };
    const vol = (x, y, r, rot) => `<g transform="translate(${x} ${y}) rotate(${rot})"><clipPath id="cv${x}"><circle r="${r}"/></clipPath>${back(r)}
      <g clip-path="url(#cv${x})">
        <path d="M${-r} ${-r * .2}C${-r * .4} ${-r * .55} ${r * .3} ${-r * .55} ${r} ${-r * .05}"/><path d="M${-r} ${-r * .6}C${-r * .4} ${-r * .95} ${r * .3} ${-r * .95} ${r} ${-r * .45}"/>
        <path d="M${-r * .02} ${-r * .3}C${r * .15} ${r * .05} ${r * .5} ${r * .35} ${r} ${r * .4}"/><path d="M${-r * .25} ${-r * .05}C${-r * .05} ${r * .4} ${r * .35} ${r * .7} ${r * .9} ${r * .75}"/>
        <path d="M${-r} ${r * .2}C${-r * .6} ${r * .45} ${-r * .35} ${r * .8} ${-r * .3} ${r}"/></g><circle r="${r}"/></g>`;
    const ten = (x, y, r, rot) => `<g transform="translate(${x} ${y}) rotate(${rot})"><clipPath id="ct${x}"><circle r="${r}"/></clipPath>${back(r)}
      <g clip-path="url(#ct${x})"><path d="M${-r * .62} ${-r}C${-r * .05} ${-r * .55} ${-r * .05} ${r * .55} ${-r * .62} ${r}"/>
      <path d="M${r * .62} ${-r}C${r * .05} ${-r * .55} ${r * .05} ${r * .55} ${r * .62} ${r}"/></g><circle r="${r}"/></g>`;
    const ping = (x, y, s, rot) => `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})">
      <rect x="-20" y="80" width="40" height="150" rx="14" fill="#05242d"/><ellipse rx="120" ry="130" fill="#05242d" stroke="none"/>
      <ellipse rx="120" ry="130"/><path d="M-20 122V230H20V122"/><ellipse cx="-20" cy="-25" rx="70" ry="62" stroke-opacity=".45"/></g>`;
    const bol = (x, y, r) => `<g>${'<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="#05242d"/>'}<circle cx="${x}" cy="${y}" r="${r}"/></g>`;
    // medalha com fita: contorno dourado, como os rastros de luz da pista
    const med = (x, y, s, rot) => `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})" stroke="#ffc94a">
      <path d="M-60 -230L-10 -40H30L-20 -230Z" fill="#05242d"/><path d="M60 -230L10 -40H-30L20 -230Z" fill="#05242d"/>
      <circle r="90" fill="#05242d"/><circle r="66" stroke-opacity=".6"/>
      <text y="28" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="80" fill="#ffc94a" stroke="none">1</text></g>`;
    const parts = [
      basq(150, 470, 230, -12),
      ten(470, 430, 95, 20),
      fut(720, 520, 250, 14),
      ping(1060, 420, .95, 28), bol(1185, 300, 34),
      vol(1350, 510, 230, -20),
      basq(1905, 480, 195, 24),
      ten(1610, 420, 100, 15),
      ten(1990, 300, 70, -30)
    ].join('');
    document.getElementById('footer').innerHTML = `<svg viewBox="0 0 2000 460">${defs}
      <g fill="none" stroke="#6ff6ff" stroke-opacity=".9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)">${parts}</g></svg>`;
  })();
</script>
</body></html>
