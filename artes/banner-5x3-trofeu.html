<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Banner 5 x 3 (troféu) — Melhores do Ano AV 2026</title>
<!-- Banner para impressão: proporção 5 x 3 (ex.: 5 m de largura por 3 m de altura).
     Versão D: foto real de mãos erguendo um troféu no canto inferior direito;
     logo Associação Volvo no canto superior direito; centro livre para fotos. -->
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  @page { size: 2000px 1200px; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2000px; height: 1200px; overflow: hidden; background: #062a33; color: #fff; }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .art { position: relative; width: 2000px; height: 1200px; overflow: hidden;
    background:
      radial-gradient(55% 65% at 18% 25%, rgba(40,150,165,.45), transparent 65%),
      radial-gradient(50% 60% at 88% 88%, rgba(242,182,50,.22), transparent 65%),
      radial-gradient(40% 50% at 70% 8%, rgba(20,100,115,.5), transparent 70%),
      linear-gradient(150deg, #1a6474 0%, #0e4351 38%, #08303b 68%, #041c24 100%); }
  /* só as linhas de uma quadra, bem suaves */
  .court { position: absolute; inset: 0; background: url('../img/quadra-fundo.svg') center / cover no-repeat; opacity: .07; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 50%, rgba(2,14,18,.5)); }

  /* logo no canto superior direito */
  .logo { position: absolute; right: 80px; top: 84px; width: 490px; z-index: 3;
    filter: drop-shadow(0 4px 18px rgba(0,0,0,.4)); }

  /* título no canto superior esquerdo */
  .title { position: absolute; left: 80px; top: 62px; z-index: 3; font-family: 'Anton', Impact, sans-serif; font-weight: 400;
    text-transform: uppercase; font-size: 100px; line-height: .98; letter-spacing: .01em; text-shadow: 0 10px 40px rgba(0,0,0,.35); }
  .title .av { display: block; color: #f2b632; }
  .title .bar { display: block; width: 160px; height: 10px; margin-top: 22px; background: linear-gradient(90deg, #f2b632 0 70%, transparent 70% 78%, #3fb5bf 78%); transform: skewX(-30deg); }

  /* listras douradas no canto inferior esquerdo, discretas */
  .stripes { position: absolute; left: -40px; bottom: -40px; width: 460px; height: 230px; opacity: .35;
    background: repeating-linear-gradient(55deg, transparent 0 34px, rgba(242,182,50,.6) 34px 44px);
    -webkit-mask-image: linear-gradient(225deg, transparent 30%, #000 85%); mask-image: linear-gradient(225deg, transparent 30%, #000 85%); }

  /* foto real: mãos erguendo o troféu, presa ao canto inferior direito e se fundindo com o fundo */
  .glow { position: absolute; right: -40px; bottom: 120px; width: 760px; height: 760px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,214,120,.38), rgba(242,182,50,.12) 40%, transparent 68%); }
  .photowrap { position: absolute; right: 0; bottom: 0; width: 1150px; height: 1200px; isolation: isolate;
    transform: scale(.62); transform-origin: 100% 100%; /* troféu do tamanho da estrela das outras artes */
    -webkit-mask-image: radial-gradient(58% 60% at 58% 58%, #000 62%, transparent 92%); mask-image: radial-gradient(58% 60% at 58% 58%, #000 62%, transparent 92%); }
  .photowrap > div { position: absolute; left: 0; right: 0; }
  /* a foto (a taça fica perto do topo da foto original) */
  .photo { top: 200px; bottom: 0; background: url('../img/parabens.jpg') right 0 top 0 / auto 1060px no-repeat; filter: saturate(1.1) contrast(1.06);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 45px); mask-image: linear-gradient(to bottom, transparent 0, #000 45px); }
  /* continuação do fundo desfocado acima da foto (faixa de cima da própria foto, esticada e borrada) */
  .ext { top: 0; height: 290px; background: url('../img/parabens.jpg') right 0 top 0 / 1569px 9000px no-repeat; filter: blur(22px) saturate(1.1); }
  /* tom petróleo por cima do desfoque claro da foto, sem cobrir a taça nem as mãos */
  .tint { top: 0; bottom: 0; mix-blend-mode: multiply; background: radial-gradient(32% 62% at 58% 55%, transparent 52%, rgba(10,55,68,.9) 100%); }
  .spark { position: absolute; background: #fff7d6; clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); filter: drop-shadow(0 0 8px #ffe08a); }
</style></head>
<body><div class="art">
  <div class="court"></div>
  <div class="stripes"></div>
  <div class="glow"></div>
  <div class="photowrap"><div class="ext"></div><div class="photo"></div><div class="tint"></div></div>
  <i class="spark" style="right:560px;bottom:520px;width:30px;height:30px"></i>
  <i class="spark" style="right:70px;bottom:640px;width:22px;height:22px"></i>
  <div class="vignette"></div>
  <img class="logo" src="../img/logo-associacao-volvo.png" alt="Associação Volvo">
  <div class="title">Melhores<br>do ano<span class="av">AV 2026</span><span class="bar"></span></div>
</div>
<script>
  // ?z=2 aumenta a arte (para gerar a imagem em alta resolução)
  const z = parseFloat(new URLSearchParams(location.search).get('z'));
  if (z) { document.documentElement.style.zoom = z; document.documentElement.style.overflow = 'hidden'; }
</script>
</body></html>
