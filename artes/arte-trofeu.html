<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Arte 2 — Melhores do Ano AV 2026 (troféu e medalhas)</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,900;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="arte-base.css">
<style>
  .glow { position: absolute; right: 0; bottom: -100px; width: 1100px; height: 1100px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,214,120,.45), rgba(242,182,50,.12) 45%, transparent 70%); }
  /* foto real do troféu, mesclada ao fundo azul */
  .trophy { position: absolute; right: -40px; bottom: -60px; width: 1150px; height: 1000px;
    background: url('../img/parabens.jpg') 86% 20% / 1460px auto no-repeat; filter: saturate(1.2) contrast(1.1) brightness(.92);
    -webkit-mask-image: radial-gradient(closest-side at 62% 52%, #000 50%, transparent 100%); mask-image: radial-gradient(closest-side at 62% 52%, #000 50%, transparent 100%); }
  .tint { position: absolute; inset: 0; background: linear-gradient(105deg, rgba(5,32,40,.45) 36%, rgba(5,32,40,.2) 62%, rgba(5,32,40,0) 80%); }
  /* medalhas */
  .medal { position: absolute; z-index: 2; border-radius: 50%; display: grid; place-content: center; text-align: center; font-weight: 900; font-style: italic;
    box-shadow: 0 18px 40px rgba(0,0,0,.5), 0 0 0 8px rgba(255,255,255,.14), inset 0 -10px 24px rgba(0,0,0,.25), inset 0 8px 18px rgba(255,255,255,.55); }
  .medal b { font-size: 1em; line-height: .9; } .medal small { font-size: .24em; letter-spacing: .12em; font-style: normal; }
  .gold { right: 820px; bottom: 110px; width: 220px; height: 220px; font-size: 92px; color: #4a3000;
    background: radial-gradient(circle at 35% 30%, #fff6cf, #f2b632 45%, #a8700f); }
  .silver { right: 1075px; bottom: 70px; width: 160px; height: 160px; font-size: 64px; color: #1f2a38;
    background: radial-gradient(circle at 35% 30%, #fff, #c9d3e0 45%, #7c8796); }
  .ribbon { position: absolute; z-index: 1; width: 64px; height: 200px;
    background: linear-gradient(90deg, #0e4f5e 0 34%, #f2b632 34% 66%, #0e4f5e 66%); box-shadow: 0 6px 16px rgba(0,0,0,.4); }
</style></head>
<body><div class="art">
  <div class="sports-bg"></div><div class="court"></div><div class="streak" style="left:420px"></div>
  <div class="glow"></div>
  <div class="trophy"></div>
  <div class="tint"></div>
  <div class="ribbon" style="right:900px;bottom:300px;transform:rotate(-12deg)"></div>
  <div class="ribbon" style="right:1130px;bottom:205px;width:48px;height:150px;transform:rotate(14deg)"></div>
  <div class="medal silver"><b>2º</b><small>LUGAR</small></div>
  <div class="medal gold"><b>1º</b><small>LUGAR</small></div>
  <div class="vignette"></div>
  <img class="logo" src="../img/logo-associacao-volvo.png" alt="Associação Volvo">
  <div class="title">Melhores<br>do ano<span class="av">AV 2026</span><span class="bar"></span></div>
</div></body></html>
